<style>
:root{--bg:#f7f4ee;--surface:#fffdf9;--ink:#17130f;--muted:#756e64;--line:#e7e0d6;--accent:#b85c38;--shadow:0 20px 60px rgba(35,25,15,.1)}:root.dark{--bg:#17130f;--surface:#211c17;--ink:#f7f1e8;--muted:#b8aea1;--line:#3a3028;--accent:#e18a62;--shadow:0 20px 60px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;line-height:1.6}a{text-decoration:none;color:inherit}.container{width:min(1080px,calc(100% - 36px));margin:auto}.nav{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font:700 1.55rem 'Playfair Display',serif}.brand span{color:var(--accent)}.back{color:var(--accent);font-weight:700}.profile{padding:75px 0 45px;display:grid;grid-template-columns:180px 1fr;gap:42px;align-items:center}.avatar{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#c88763,#684438);color:#fff;font:700 4.5rem 'Playfair Display',serif;box-shadow:var(--shadow)}.eyebrow{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem}.name{font:700 clamp(3rem,7vw,5.5rem)/.95 'Playfair Display',serif;letter-spacing:-.04em;margin:12px 0}.bio{color:var(--muted);max-width:650px;font-size:1.05rem}.stats{display:flex;gap:35px;margin-top:22px}.stats strong{font:700 1.4rem 'Playfair Display',serif}.stats span{display:block;color:var(--muted);font-size:.8rem}.section{padding:35px 0 75px}.section h2{font:700 2.1rem 'Playfair Display',serif}.books{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:24px;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.cover{height:220px;border-radius:14px;background:linear-gradient(145deg,#d9c3a4,#765748);display:flex;align-items:end;padding:20px;color:#fff;font:700 1.8rem/1.05 'Playfair Display',serif}.card:nth-child(2) .cover{background:linear-gradient(145deg,#c4d0c0,#59695c)}.card:nth-child(3) .cover{background:linear-gradient(145deg,#c9b9ce,#65526c)}.title{font:700 1.3rem 'Playfair Display',serif;margin:16px 0 4px}.muted{color:var(--muted);font-size:.88rem}.footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:.85rem}@media(max-width:650px){.profile{grid-template-columns:1fr;padding-top:50px}.avatar{width:125px;height:125px;font-size:3.2rem}.books{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="container nav"><a class="brand" href="index.html">Book<span>Verse</span></a><a class="back" href="index.html">← Discovery</a></div></header>
<main class="container"><section class="profile"><div class="avatar" id="avatar">E</div><div><span class="eyebrow">Author profile</span><h1 class="name" id="name">Elena Montgomery</h1><p class="bio" id="bio">Author of stories that explore impossible distances, human connection, and the quiet questions hiding behind the stars.</p><div class="stats"><div><strong id="count">1</strong><span>Book</span></div><div><strong>4.8</strong><span>Avg. rating</span></div><div><strong>1.2k</strong><span>Readers</span></div></div></div></section><section class="section"><h2>Stories by this author</h2><div class="books" id="books"></div></section></main>
<footer class="footer"><div class="container">© 2026 BookVerse · <a href="library.html">My Library</a> · <a href="genres.html">Genres</a></div></footer>
<script>
const authors={
'Elena Montgomery':{initial:'E',bio:'Author of stories that explore impossible distances, human connection, and the quiet questions hiding behind the stars.',books:[['The Silent Stars','Science Fiction','4.8 · 1.2k']]},
'Marcus Chen':{initial:'M',bio:'Fantasy writer fascinated by ancient worlds, impossible magic, and the choices people make when darkness arrives.',books:[["Shadow's Embrace",'Fantasy','4.4 · 890']]},
'Samantha Wright':{initial:'S',bio:'Writer of speculative fiction about memory, identity, and the strange ways tomorrow can change today.',books:[['Echoes of Tomorrow','Fiction','4.9 · 2.4k']]}}
const params=new URLSearchParams(location.search),requested=params.get('author')||'Elena Montgomery',author=authors[requested]||authors['Elena Montgomery'];document.title=Object.keys(authors).includes(requested)?requested+' — BookVerse':'Author — BookVerse';document.getElementById('name').textContent=requested;document.getElementById('avatar').textContent=author.initial;document.getElementById('bio').textContent=author.bio;document.getElementById('count').textContent=author.books.length;
document.getElementById('books').innerHTML=author.books.map(b=>`<article class="card"><a href="book.html?book=${encodeURIComponent(b[0])}"><div class="cover">${b[0].replace(/ /g,'<br>')}</div><h3 class="title">${b[0]}</h3><div class="muted">${b[1]} · ★★★★★ ${b[2]}</div></a></article>`).join('');
</script></body></html>
