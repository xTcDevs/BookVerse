<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f6f1e9;
      font-family: Georgia, 'Times New Roman', serif;
      color: #2a2420;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; margin: 0 auto">
      <tr>
        <td style="font-size: 22px; padding-bottom: 24px">BookVerse</td>
      </tr>
      <tr>
        <td style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; padding-bottom: 16px">
          Here is your sign-in code:
        </td>
      </tr>
      <tr>
        <td style="font-family: 'Courier New', monospace; font-size: 34px; letter-spacing: 8px; padding: 16px 0 24px">
          {{ .Token }}
        </td>
      </tr>
      <tr>
        <td style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.5; color: #5b5048">
          It works once and expires in 15 minutes. If you didn’t ask to sign in to BookVerse, you can ignore this email.
        </td>
      </tr>
    </table>
  </body>
</html>
