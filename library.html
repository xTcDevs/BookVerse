<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library — BookVerse</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--bg:#f7f4ee;--surface:#fffdf9;--ink:#17130f;--muted:#756e64;--line:#e7e0d6;--accent:#b85c38}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}.container{width:min(1100px,calc(100% - 36px));margin:auto}.nav{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font:700 1.55rem 'Playfair Display',serif;text-decoration:none;color:inherit}.brand span{color:var(--accent)}.back{color:var(--accent);font-weight:700;text-decoration:none}.hero{padding:70px 0 35px}.eyebrow{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem}.title{font:700 clamp(3rem,6vw,5rem)/.95 'Playfair Display',serif;margin:12px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:70px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}.cover{height:280px;padding:24px;display:flex;align-items:end;color:#fff;background:linear-gradient(145deg,#d9c3a4,#765748)}.card:nth-child(3n+2) .cover{background:linear-gradient(145deg,#c4d0c0,#59695c)}.card:nth-child(3n) .cover{background:linear-gradient(145deg,#c9b9ce,#65526c)}.cover strong{font:700 2rem/1.05 'Playfair Display',serif}.body{padding:20px}.author{color:var(--muted);margin:4px 0 14px}.actions{display:flex;justify-content:space-between;align-items:center}.link,.remove{font-weight:700;color:var(--accent);background:none;border:0;cursor:pointer}.empty{border:1px dashed var(--line);border-radius:22px;padding:60px 25px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding-top:45px}}</style></head><body><header><div class="container nav"><a class="brand" href="index.html">Book<span>Verse</span></a><a class="back" href="index.html">← Discover books</a></div></header><main class="container"><section class="hero"><span class="eyebrow">Your collection</span><h1 class="title">My Library.</h1><p class="muted">Books you've saved for later, all in one place.</p></section><section id="library" class="grid"></section></main><script>const books={"The Silent Stars":{author:'Elena Montgomery',genre:'Science Fiction'},"Shadow's Embrace":{author:'Marcus Chen',genre:'Fantasy'},"Echoes of Tomorrow":{author:'Samantha Wright',genre:'Fiction'}};const key='bookverse-library';let saved=JSON.parse(localStorage.getItem(key)||'[]');const grid=document.getElementById('library');function render(){if(!saved.length){grid.className='';grid.innerHTML='<div class="empty"><h2>Your library is empty.</h2><p>Save a book from discovery and it will appear here.</p><a class="link" href="index.html#trending">Explore trending books →</a></div>';return}grid.className='grid';grid.innerHTML=saved.map(name=>{const b=books[name]||{author:'Unknown author',genre:'Book'};return `<article class="card"><div class="cover"><strong>${name.replace(/ /g,'<br>')}</strong></div><div class="body"><strong>${name}</strong><div class="author">${b.author} · ${b.genre}</div><div class="actions"><a class="link" href="book.html?book=${encodeURIComponent(name)}">View book →</a><button class="remove" data-name="${name}">Remove</button></div></div></article>`}).join('');document.querySelectorAll('.remove').forEach(btn=>btn.onclick=()=>{saved=saved.filter(x=>x!==btn.dataset.name);localStorage.setItem(key,JSON.stringify(saved));render()})}render();</script></body></html>
